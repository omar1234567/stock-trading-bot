<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Trader Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#080c10;--bg2:#0d1219;--bg3:#111820;--border:#1e2a35;--amber:#f5a623;--amber2:#ffcb6b;--green:#00d084;--red:#ff4757;--blue:#4fc3f7;--purple:#9c88ff;--text:#e8edf2;--muted:#5a6a7a;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;overflow:hidden;}
.nav{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--amber);white-space:nowrap;}
.logo span{color:var(--text);}
.search-box{flex:1;max-width:320px;position:relative;}
.search-box input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 12px 7px 32px;color:var(--text);font-family:'Space Mono',monospace;font-size:12px;outline:none;}
.search-box input:focus{border-color:var(--amber);}
.search-box input::placeholder{color:var(--muted);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;}
.btn-a{background:var(--amber);color:var(--bg);border:none;border-radius:6px;padding:7px 14px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;}
.btn-a:hover{background:var(--amber2);}
.btn-o{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;}
.btn-o:hover{border-color:var(--amber);color:var(--amber);}
.layout{position:fixed;top:54px;bottom:0;left:0;right:0;display:flex;}
.sidebar{width:185px;min-width:185px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.sbg{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);padding:10px 12px 4px;text-transform:uppercase;}
.sbi{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;transition:background 0.1s;}
.sbi:hover{background:var(--bg3);}
.sbi.active{background:rgba(245,166,35,0.08);border-left-color:var(--amber);}
.sbi .sym{font-size:11px;font-weight:700;}
.sbi.active .sym{color:var(--amber);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.dot.c{background:var(--green);}.dot.d{background:var(--amber);}.dot.nc{background:var(--red);}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.tbar{height:64px;min-height:64px;display:flex;align-items:center;gap:20px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;}
.tsym{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--amber);letter-spacing:-0.5px;}
.tname{font-size:10px;color:var(--muted);}
.tprice{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;}
.tchg{font-size:11px;}
.trange{font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto;}
.cwrap{flex:1;position:relative;overflow:hidden;}
#CC{position:absolute;top:0;left:0;}
#RP{position:absolute;left:0;right:0;bottom:0;height:130px;border-top:1px solid var(--border);}
.rlbl{position:absolute;top:5px;left:10px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;z-index:2;}
#RC{width:100%;height:130px;}
.right{width:235px;min-width:235px;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.rs{padding:12px 14px;border-bottom:1px solid var(--border);}
.rt{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.rr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.rl{font-size:11px;color:var(--muted);}.rv{font-size:11px;font-weight:700;}
.rv.up{color:var(--green);}.rv.dn{color:var(--red);}.rv.wn{color:var(--amber);}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.5px;}
.bc{background:rgba(0,208,132,0.12);color:var(--green);border:1px solid rgba(0,208,132,0.3);}
.bd{background:rgba(245,166,35,0.12);color:var(--amber);border:1px solid rgba(245,166,35,0.3);}
.bnc{background:rgba(255,71,87,0.12);color:var(--red);border:1px solid rgba(255,71,87,0.3);}
.rnote{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px;}
.dbdg{padding:4px 10px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:0.5px;}
.dl{background:rgba(0,208,132,0.15);color:var(--green);border:1px solid rgba(0,208,132,0.3);}
.ds{background:rgba(255,71,87,0.15);color:var(--red);border:1px solid rgba(255,71,87,0.3);}
.abtn{width:100%;background:linear-gradient(135deg,var(--amber),#e8920d);color:var(--bg);border:none;border-radius:6px;padding:10px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.5px;}
.abtn:hover{opacity:0.88;}.abtn:disabled{opacity:0.4;cursor:not-allowed;}
.aout{font-size:10px;line-height:1.65;color:#8899aa;white-space:pre-wrap;margin-top:8px;}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;align-items:center;justify-content:center;}
.mbg.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:22px;width:340px;max-width:92vw;}
.modal h3{font-family:'Syne',sans-serif;font-size:16px;color:var(--amber);margin-bottom:6px;}
.modal p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.modal input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:'Space Mono',monospace;font-size:12px;outline:none;margin-bottom:10px;}
.modal input:focus{border-color:var(--amber);}
.mbtns{display:flex;gap:8px;}
.msave{flex:1;background:var(--amber);color:var(--bg);border:none;border-radius:6px;padding:9px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;}
.mcancel{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:9px 13px;font-family:'Space Mono',monospace;font-size:12px;cursor:pointer;}
@media(max-width:768px){.sidebar{width:130px;min-width:130px;}.right{display:none;}}
@media(max-width:520px){.sidebar{display:none;}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">HALAL<span>TRADER</span></div>
  <div class="search-box">
    <span class="si">⌕</span>
    <input id="SI" type="text" placeholder="Ticker… e.g. AAPL" onkeydown="if(event.key==='Enter')go(this.value)">
  </div>
  <button class="btn-a" onclick="go(document.getElementById('SI').value)">ANALYSE</button>
  <button class="btn-o" onclick="openM()">⚙ API KEY</button>
</nav>
<div class="layout">
  <aside class="sidebar" id="SB"></aside>
  <div class="main">
    <div class="tbar" id="TB">
      <span style="font-size:12px;color:var(--muted)">Select a ticker</span>
    </div>
    <div class="cwrap" id="CW">
      <div id="CC"></div>
      <div id="RP"><div class="rlbl">RSI 14</div><div id="RC"></div></div>
    </div>
  </div>
  <aside class="right">
    <div class="rs"><div class="rt">☪ Shariah Status</div><div id="PS"><span class="rl">Select a ticker</span></div></div>
    <div class="rs"><div class="rt">◈ Trade Signal</div><div id="PG"><span class="rl">Select a ticker</span></div></div>
    <div class="rs"><div class="rt">⬡ Technicals</div><div id="PT"><span class="rl">Select a ticker</span></div></div>
    <div class="rs"><div class="rt">◉ Claude Analysis</div>
      <button class="abtn" id="AB" disabled onclick="runC()">SELECT A TICKER FIRST</button>
      <div class="aout" id="AO"></div>
    </div>
  </aside>
</div>
<div class="mbg" id="MB" onclick="if(event.target===this)closeM()">
  <div class="modal">
    <h3>Anthropic API Key</h3>
    <p>Stored only in your browser. Used only for Claude analysis.</p>
    <input type="password" id="AK" placeholder="sk-ant-api03-...">
    <div class="mbtns">
      <button class="msave" onclick="saveK()">Save</button>
      <button class="mcancel" onclick="closeM()">Cancel</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script>
const WL={
  "US Large-Cap":["NVDA","AAPL","MSFT","AVGO","AMD","MU","LRCX","AMAT","TXN","KLAC","GOOGL","ORCL","ADBE","CRM","NOW","PANW","CRWD","ANET","LLY","JNJ","ABBV","MRK","ABT","TMO","AMGN","GILD","REGN","VRTX","BSX","SYK","ISRG","DHR","XOM","CVX","COP","EOG","TSLA","HD","PG","PEP","COST","LOW","NKE","LIN","CAT","DE","HON","GEV","ODFL"],
  "US Mid-Cap":["PODD","HOLX","EXAS","AXON","TRMB","ENTG","SAIA","DECK","WSM","LULU","ELF"],
  "TSX Large":["CSU.TO","SHOP.TO","OTEX.TO","TIH.TO","TFII.TO","WCN.TO","CNR.TO","CP.TO","STN.TO","WSP.TO","CNQ.TO","SU.TO","NTR.TO","WPM.TO","FNV.TO","AEM.TO","ATD.TO","DOL.TO","MG.TO"],
  "TSX Mid":["KXS.TO","DSG.TO","LSPD.TO","LUN.TO","ERO.TO","AGI.TO","K.TO","PBH.TO","MTY.TO","DOO.TO"]
};
let ticker=null,CC=null,CS=null,E9=null,E21=null,E50=null,RC=null,RS=null,R30=null,R70=null,SL=[],ready=false;
 
function buildSB(){
  const sb=document.getElementById('SB');sb.innerHTML='';
  for(const[g,ts]of Object.entries(WL)){
    const d=document.createElement('div');
    d.innerHTML=`<div class="sbg">${g}</div>`;
    ts.forEach(t=>{const e=document.createElement('div');e.className='sbi';e.id='sb_'+t;e.innerHTML=`<span class="sym">${t}</span><span class="dot" id="dt_${t}"></span>`;e.onclick=()=>go(t);d.appendChild(e);});
    sb.appendChild(d);
  }
}
function setDot(t,s){const d=document.getElementById('dt_'+t);if(!d)return;d.className='dot'+(s==='COMPLIANT'?' c':s==='DOUBTFUL'?' d':s==='NON-COMPLIANT'?' nc':'');}
 
function initCharts(){
  const ce=document.getElementById('CC'),re=document.getElementById('RC'),cw=document.getElementById('CW');
  if(!ce||!re||!cw)return false;
  if(typeof LightweightCharts==='undefined')return false;
  const RH=130,TH=cw.offsetHeight||(window.innerHeight-54-64),CH=Math.max(TH-RH-1,200),W=cw.offsetWidth||(window.innerWidth-185-235);
  ce.style.cssText=`position:absolute;top:0;left:0;width:${W}px;height:${CH}px;`;
  const base={layout:{background:{color:'#080c10'},textColor:'#5a6a7a',fontFamily:"'Space Mono',monospace",fontSize:10},grid:{vertLines:{color:'#111820'},horzLines:{color:'#111820'}},crosshair:{mode:0,vertLine:{color:'#f5a62340',labelBackgroundColor:'#f5a623'},horzLine:{color:'#f5a62340',labelBackgroundColor:'#f5a623'}},rightPriceScale:{borderColor:'#1e2a35',textColor:'#5a6a7a'},timeScale:{borderColor:'#1e2a35',timeVisible:true,secondsVisible:false}};
  try{
    CC=LightweightCharts.createChart(ce,{...base,width:W,height:CH});
    CS=CC.addCandlestickSeries({upColor:'#00d084',downColor:'#ff4757',borderUpColor:'#00d084',borderDownColor:'#ff4757',wickUpColor:'#00d08480',wickDownColor:'#ff475780'});
    E9=CC.addLineSeries({color:'#f5a623',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    E21=CC.addLineSeries({color:'#4fc3f7',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    E50=CC.addLineSeries({color:'#9c88ff',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false});
  }catch(e){console.error('CC fail',e);return false;}
  try{
    RC=LightweightCharts.createChart(re,{...base,width:W,height:RH,rightPriceScale:{borderColor:'#1e2a35',textColor:'#5a6a7a',scaleMargins:{top:0.1,bottom:0.1}}});
    RS=RC.addLineSeries({color:'#f5a623',lineWidth:1.5,priceLineVisible:false,lastValueVisible:true});
    R30=RC.addLineSeries({color:'#00d08450',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
    R70=RC.addLineSeries({color:'#ff475750',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
  }catch(e){console.error('RC fail',e);return false;}
  CC.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&RC)RC.timeScale().setVisibleLogicalRange(r);});
  RC.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&CC)CC.timeScale().setVisibleLogicalRange(r);});
  window.addEventListener('resize',()=>{
    const RH2=130,TH2=cw.offsetHeight||(window.innerHeight-54-64),CH2=Math.max(TH2-RH2-1,200),W2=cw.offsetWidth||(window.innerWidth-185-235);
    ce.style.cssText=`position:absolute;top:0;left:0;width:${W2}px;height:${CH2}px;`;
    if(CC)CC.applyOptions({width:W2,height:CH2});if(RC)RC.applyOptions({width:W2,height:RH2});
  });
  ready=true;return true;
}
 
async function fetchD(sym){
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=1y`;
  for(const p of[`https://corsproxy.io/?${encodeURIComponent(url)}`,`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`]){
    try{
      const ct=new AbortController(),tid=setTimeout(()=>ct.abort(),9000);
      const r=await fetch(p,{signal:ct.signal});clearTimeout(tid);
      if(!r.ok)continue;
      const txt=await r.text();let raw;
      try{const j=JSON.parse(txt);raw=j.contents?JSON.parse(j.contents):j;}catch{continue;}
      if(raw?.chart?.result?.[0])return raw.chart.result[0];
    }catch{continue;}
  }
  throw new Error('Data unavailable — try again');
}
 
function calcEMA(a,n){const k=2/(n+1);let v=a[0];return a.map((x,i)=>{if(!i)return x;v=x*k+v*(1-k);return +v.toFixed(2);});}
function calcRSI(a,n=14){let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];d>=0?g+=d:l-=d;}let ag=g/n,al=l/n;const o=new Array(n).fill(null);o.push(+(100-100/(1+ag/(al||.001))).toFixed(1));for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n;o.push(+(100-100/(1+ag/(al||.001))).toFixed(1));}return o;}
 
function renderCharts(candles,e9,e21,e50,rsi14){
  if(!ready||!CS||!E9||!E21||!E50||!RS||!R30||!R70)return;
  SL.forEach(s=>{try{CC.removeSeries(s);}catch{}});SL=[];
  CS.setData(candles.map(c=>({time:c.t,open:c.o,high:c.h,low:c.l,close:c.c})));
  E9.setData(candles.slice(9).map((c,i)=>({time:c.t,value:e9[i+9]})));
  E21.setData(candles.slice(21).map((c,i)=>({time:c.t,value:e21[i+21]})));
  E50.setData(candles.slice(50).map((c,i)=>({time:c.t,value:e50[i+50]})));
  RS.setData(candles.slice(14).map((c,i)=>rsi14[i+14]!=null?{time:c.t,value:rsi14[i+14]}:null).filter(Boolean));
  if(candles.length>1){const ft=candles[0].t,lt=candles[candles.length-1].t;R30.setData([{time:ft,value:30},{time:lt,value:30}]);R70.setData([{time:ft,value:70},{time:lt,value:70}]);}
  CC.timeScale().fitContent();RC.timeScale().fitContent();
}
 
function drawSig(sig,candles){
  if(!sig||!CC||!candles.length)return;
  const ft=candles[Math.floor(candles.length*.75)].t,lt=candles[candles.length-1].t;
  const add=(v,col,t)=>{const s=CC.addLineSeries({color:col,lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:true,title:t});s.setData([{time:ft,value:v},{time:lt,value:v}]);SL.push(s);};
  add(sig.entry,'#4fc3f780','ENTRY');add(sig.stop,'#ff475780','STOP');add(sig.tp1,'#00d08480','TP1');if(sig.tp2)add(sig.tp2,'#00d08440','TP2');
}
 
function estSig(price,e9v,e21v,e50v,rsiV,candles){
  let b=0,s=0;
  if(e9v>e21v&&e21v>e50v)b++;else if(e9v<e21v&&e21v<e50v)s++;
  if(price>e50v)b++;else s++;
  if(rsiV>50&&rsiV<70)b++;else if(rsiV<50&&rsiV>30)s++;
  const lc=candles[candles.length-1];if(lc.c>lc.o)b++;else s++;
  const dir=b>=3?'LONG':s>=3?'SHORT':null;if(!dir)return null;
  const lows=candles.slice(-30).map(c=>c.l).sort((a,b)=>a-b);
  const highs=candles.slice(-30).map(c=>c.h).sort((a,b)=>b-a);
  const sup=lows[Math.floor(lows.length*.15)],res=highs[Math.floor(highs.length*.15)];
  let stop,tp1,tp2;
  if(dir==='LONG'){stop=+(sup*.99).toFixed(2);const r=price-stop;tp1=+(price+r*2).toFixed(2);tp2=+(price+r*3).toFixed(2);}
  else{stop=+(res*1.01).toFixed(2);const r=stop-price;tp1=+(price-r*2).toFixed(2);tp2=+(price-r*3).toFixed(2);}
  return{dir,entry:+price.toFixed(2),stop,tp1,tp2,rr:+Math.abs((tp1-price)/(price-stop)).toFixed(1),prob:Math.min(50+(Math.max(b,s)-2)*12,82),score:Math.max(b,s)};
}
 
async function go(sym){
  if(!sym)return;sym=sym.toUpperCase().trim();ticker=sym;
  document.getElementById('SI').value=sym;
  document.getElementById('AO').textContent='';
  document.getElementById('AB').disabled=true;document.getElementById('AB').textContent='FETCHING…';
  document.getElementById('PS').innerHTML='<div class="spin" style="width:14px;height:14px"></div>';
  document.getElementById('PG').innerHTML='<span class="rl">Loading…</span>';
  document.getElementById('PT').innerHTML='<span class="rl">Loading…</span>';
  document.querySelectorAll('.sbi').forEach(e=>e.classList.remove('active'));
  const si=document.getElementById('sb_'+sym);if(si){si.classList.add('active');si.scrollIntoView({block:'nearest'});}
  document.getElementById('TB').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="spin"></div><span style="font-size:12px;color:var(--muted)">Loading ${sym}…</span></div>`;
  try{
    const res=await fetchD(sym);
    const meta=res.meta,ts=res.timestamp,q=res.indicators.quote[0];
    const candles=ts.map((t,i)=>({t,o:+q.open[i]?.toFixed(2),h:+q.high[i]?.toFixed(2),l:+q.low[i]?.toFixed(2),c:+q.close[i]?.toFixed(2),v:q.volume[i]||0})).filter(c=>c.o&&c.h&&c.l&&c.c);
    const closes=candles.map(c=>c.c);
    const e9=calcEMA(closes,9),e21=calcEMA(closes,21),e50=calcEMA(closes,50),rsi14=calcRSI(closes,14);
    const n=candles.length-1,price=meta.regularMarketPrice,prev=meta.chartPreviousClose||closes[n-1];
    const chg=price-prev,chgP=chg/prev*100,cur=sym.endsWith('.TO')?'CAD':'USD';
    const avgV=meta.averageDailyVolume10Day||0,volR=avgV>0?Math.round(candles[n].v/avgV*100):0;
    // Header
    const col=chg>=0?'var(--green)':'var(--red)',sign=chg>=0?'+':'',cs=cur==='CAD'?'CA$':'$';
    document.getElementById('TB').innerHTML=`<div><div class="tsym">${sym}</div><div class="tname">${meta.shortName||sym} · ${cur}</div></div><div><div class="tprice" style="color:${col}">${cs}${price.toFixed(2)}</div><div class="tchg" style="color:${col}">${sign}${chg.toFixed(2)} (${sign}${chgP.toFixed(2)}%)</div></div><div class="trange">52W: ${cs}${meta.fiftyTwoWeekLow?.toFixed(2)} – ${cs}${meta.fiftyTwoWeekHigh?.toFixed(2)}</div>`;
    // Shariah
    const bad=['JPM','GS','BAC','WFC','C','V','MA','AXP','MET','PRU','AFL','BRK'];
    const sh=bad.includes(sym.replace('.TO',''))?'NON-COMPLIANT':'COMPLIANT';
    setDot(sym,sh);
    document.getElementById('PS').innerHTML=`<span class="bdg ${sh==='COMPLIANT'?'bc':sh==='DOUBTFUL'?'bd':'bnc'}">${sh==='COMPLIANT'?'✓':sh==='DOUBTFUL'?'⚠':'✗'} ${sh}</span><div class="rnote">${sh==='COMPLIANT'?'Passes sector screening. Full AAOIFI check runs in bot.':'Fails sector screen — verify before trading.'}</div>`;
    // Technicals
    const al=e9[n]>e21[n]&&e21[n]>e50[n]?'BULLISH':e9[n]<e21[n]&&e21[n]<e50[n]?'BEARISH':'MIXED';
    const ac=al==='BULLISH'?'up':al==='BEARISH'?'dn':'wn',rc=rsi14[n]<30?'up':rsi14[n]>70?'dn':'';
    document.getElementById('PT').innerHTML=`<div class="rr"><span class="rl">RSI (14)</span><span class="rv ${rc}">${rsi14[n]}</span></div><div class="rr"><span class="rl">EMA 9</span><span class="rv">${e9[n]}</span></div><div class="rr"><span class="rl">EMA 21</span><span class="rv">${e21[n]}</span></div><div class="rr"><span class="rl">EMA 50</span><span class="rv">${e50[n]}</span></div><div class="rr"><span class="rl">EMA Align</span><span class="rv ${ac}">${al}</span></div><div class="rr"><span class="rl">vs EMA 50</span><span class="rv ${price>e50[n]?'up':'dn'}">${price>e50[n]?'ABOVE':'BELOW'}</span></div><div class="rr"><span class="rl">Vol vs Avg</span><span class="rv ${volR>=100?'up':'wn'}">${volR}%</span></div>`;
    // Signal
    const sig=estSig(price,e9[n],e21[n],e50[n],rsi14[n],candles);
    if(!sig){document.getElementById('PG').innerHTML='<span class="rl">No clear signal — indicators mixed.</span>';}
    else{document.getElementById('PG').innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="dbdg ${sig.dir==='LONG'?'dl':'ds'}">${sig.dir==='LONG'?'↑':'↓'} ${sig.dir}</span><span class="rl">${sig.score}/4 signals</span></div><div class="rr"><span class="rl">Entry</span><span class="rv">${cs}${sig.entry}</span></div><div class="rr"><span class="rl">Stop Loss</span><span class="rv dn">${cs}${sig.stop}</span></div><div class="rr"><span class="rl">Take Profit 1</span><span class="rv up">${cs}${sig.tp1}</span></div><div class="rr"><span class="rl">Take Profit 2</span><span class="rv up">${cs}${sig.tp2}</span></div><div class="rr"><span class="rl">Risk/Reward</span><span class="rv wn">1 : ${sig.rr}</span></div><div class="rr"><span class="rl">Probability</span><span class="rv" style="color:var(--amber)">${sig.prob}%</span></div><div class="rnote" style="margin-top:6px">⚠ Estimate — run Claude for full analysis</div>`;}
    // Charts
    renderCharts(candles,e9,e21,e50,rsi14);
    if(sig)drawSig(sig,candles);
    document.getElementById('AB').disabled=false;document.getElementById('AB').textContent='⚡ RUN CLAUDE ANALYSIS';
  }catch(err){
    document.getElementById('TB').innerHTML=`<span style="color:var(--red);font-size:12px">❌ ${sym}: ${err.message}</span>`;
    console.error(err);
  }
}
 
async function runC(){
  const key=localStorage.getItem('apiKey');if(!key){openM();return;}if(!ticker)return;
  const btn=document.getElementById('AB'),out=document.getElementById('AO');
  btn.disabled=true;btn.textContent='⏳ ANALYSING…';out.textContent='';
  try{
    const res=await fetchD(ticker);const q=res.indicators.quote[0];
    const closes=res.timestamp.map((_,i)=>q.close[i]).filter(Boolean);const n=closes.length-1;
    const e9v=calcEMA(closes,9)[n],e21v=calcEMA(closes,21)[n],e50v=calcEMA(closes,50)[n],rsiV=calcRSI(closes,14)[n];
    const price=res.meta.regularMarketPrice,al=e9v>e21v&&e21v>e50v?'BULLISH':e9v<e21v&&e21v<e50v?'BEARISH':'MIXED';
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:350,messages:[{role:'user',content:`Analyze ${ticker} for a Shariah-compliant trader. Be concise.\nData: Price $${price.toFixed(2)}, RSI ${rsiV}, EMA9 ${e9v}, EMA21 ${e21v}, EMA50 ${e50v}, Trend ${al}\nFormat:\nDIRECTION: [LONG/SHORT/NO TRADE]\nCONVICTION: [★ to ★★★★★]\nSHARIAH: [COMPLIANT/DOUBTFUL] — [reason]\nSETUP: [2 sentences]\nRISK: [1 sentence]\nPROBABILITY: [X%]`}]})});
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'API error');}
    const d=await r.json();out.textContent=d.content[0].text;
  }catch(err){out.textContent='❌ '+err.message;}
  finally{btn.disabled=false;btn.textContent='⚡ RUN CLAUDE ANALYSIS';}
}
 
function openM(){document.getElementById('AK').value=localStorage.getItem('apiKey')||'';document.getElementById('MB').classList.add('show');}
function closeM(){document.getElementById('MB').classList.remove('show');}
function saveK(){const k=document.getElementById('AK').value.trim();if(k){localStorage.setItem('apiKey',k);closeM();}}
 
window.addEventListener('load',()=>{
  buildSB();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const ok=initCharts();
    if(!ok){console.error('Chart init failed');return;}
    if(!localStorage.getItem('apiKey'))setTimeout(openM,1000);
    setTimeout(()=>go('NVDA'),200);
  }));
});
