name: Daily Stock Trading Bot

on:
  schedule:
    # Runs at 11:00 UTC = 7:00 AM Eastern Time, Monday through Friday
    - cron: '0 11 * * 1-5'

  # Allows you to manually trigger the bot anytime from GitHub (great for testing)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Allow the workflow to write back to the repository (needed for trades_log.json)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}
        run: python bot.py

      - name: Save trades log back to repository
        run: |
          git config user.name  "Stock Bot"
          git config user.email "stock-bot@github-actions"
          git add trades_log.json || true
          git diff --staged --quiet || git commit -m "📊 Update trades log — $(date +'%Y-%m-%d')"
          git push || true
